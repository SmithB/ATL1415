[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ATL1415"
description = "Utilities for creating the NASA ICESat-2 ATL14/15 products"
keywords = [
    "ICESat-2",
    "ATL14",
    "ATL15",
    "ATL14/15"
]
authors = [
    {name = "Ben Smith", email = "besmith@uw.edu"}
]
maintainers = [
    {name = "ATL14/15 contributors"}
]

license = {file = "LICENSE"}
readme = "README.md"
version = "2.0.0"

requires-python = ">=3.6"
dependencies = [
    "h5py",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pyproj",
    "scipy>=1.10.1",
    "shapely",
    "cartopy",
    "imageio",
    # [cloud] pulls earthaccess/s3fs/fsspec, without which the ATL11 cloud read
    # path fails at import.  The extra is purely additive, so this one install
    # also satisfies the plain pointCollection that LSsurf resolves to.
    "pointCollection[cloud] @ git+https://github.com/SmithB/pointCollection.git",
    "LSsurf @ git+https://github.com/smithb/LSsurf.git"
    # SMBcorr is NOT required: it is needed only for the --firn_model correction,
    # which is imported lazily.  See the [firn] extra below.
]

classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/SmithB/ATL1415"
Issues = "https://github.com/SmithB/ATL1415/issues"

[project.optional-dependencies]
all = ["gdal", "notebook", "shapely"]
dev = ["flake8", "pytest>=4.6", "pytest-cov"]
# Only needed to run the firn correction (--firn_model, without --firn_grid_file).
# Upstream tsutterley/SMBcorr rather than the smithb fork: the fork has diverged
# (40 commits behind / 27 ahead) and still uses np.NaN, removed in numpy 2.0.
# No tags upstream, so pin the sha -- a DPS build clones fresh every time.
firn = ["SMBcorr @ git+https://github.com/tsutterley/SMBcorr.git@282e6be64e9b8b46e2f1deb6a89960dcd026705b"]

[project.scripts]
"ATL11_to_ATL15.py" = "ATL1415.ATL11_to_ATL15:main"
"ATL14_browse_plots.py" = "ATL1415.scripts.ATL14_browse_plots:main"
"ATL14_write2nc.py" = "ATL1415.scripts.ATL14_write2nc:main"
"ATL15_browse_plots.py" = "ATL1415.scripts.ATL15_browse_plots:main"
"ATL15_write2nc.py" = "ATL1415.scripts.ATL15_write2nc:main"
"_usgs.py" = "ATL1415.scripts._usgs:main"
"check_tile_data_vs_DEM.py" = "ATL1415.scripts.check_tile_data_vs_DEM:main"
"make_200km_tiles.py" = "ATL1415.scripts.make_200km_tiles:main"
"make_ATL11_index.py" = "ATL1415.scripts.make_ATL11_index:main"
"make_ATL1415_queue.py" = "ATL1415.scripts.make_ATL1415_queue:main"
"make_mosaic_jobs.py" = "ATL1415.scripts.make_mosaic_jobs:main"
"make_GL_ATL1415_queue.py" = "ATL1415.scripts.make_GL_ATL1415_queue:main"
"make_field_size_report.py" = "ATL1415.scripts.make_field_size_report:main"
"setup_AA_sectors.py" = "ATL1415.scripts.setup_AA_sectors:main"
"setup_ATL1415_region.py" = "ATL1415.scripts.setup_ATL1415_region:main"
"setup_ATL1415_run.py" = "ATL1415.scripts.setup_ATL1415_run:main"
"setup_slurm_run.py" = "ATL1415.scripts.setup_slurm_run:main"
"make_200km_to_mosaic_jobs.py" = "ATL1415.scripts.make_200km_to_mosaic_jobs:main"
"slurm_run_status.py" = "ATL1415.scripts.slurm_run_status:main"
[tool.setuptools]
script-files = ["scripts/run_antarctic_tonc.sh", "scripts/run_arctic_matched.sh", "scripts/run_arctic_mosaic.sh", "scripts/run_arctic_prelim.sh", "scripts/run_arctic_to_nc.sh"]

[tool.setuptools.packages.find]
exclude = ["test*"]

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = ".git"
python_files = [
    "test*.py"
]
testpaths = [
    "test"
]
