name: ATL14
channels:
  - conda-forge
  - defaults
dependencies:
  # Pin python to match the ADE.  Left unpinned, the solver takes the newest it
  # can (3.14.7 on the first DPS build), which has no cartopy wheels on PyPI --
  # pip then falls back to the sdist and needs a C++ compiler -- and drags in a
  # numpy/scipy/pandas stack well ahead of anything this code has run against.
  - python=3.13
  # maap_base is debian:11 + git + Miniforge and ships no toolchain, but LSsurf
  # compiles a Cython extension and sparseqr (PySPQR) compiles CFFI bindings, so
  # the env has to supply the compilers itself.  Without these, pip dies with
  # "No such file or directory: 'gcc'" after conda has already succeeded.
  - c-compiler
  - cxx-compiler
  - suitesparse
  # LSsurf/smooth_fit.py imports threadpool_limits, but LSsurf's requirements.txt
  # (which feeds its install_requires) omits threadpoolctl, so pip never pulls
  # it.  smooth_fit is the core solve, so this would fail on every tile job, not
  # just at import.  The real fix belongs upstream in SmithB/LSsurf.
  - threadpoolctl
  # From conda so pip never tries to build cartopy's trace.cpp from source.
  - cartopy
  - pip
  - scipy
  # Pinned to the ADE minor: 2.5 arrived with python 3.13 in the solve and is
  # ahead of anything this code has been exercised against.
  - numpy=2.4
  - h5py
  # -base: the full matplotlib metapackage adds qt6-main/pyside6/libclang
  # (~140 MB) for a GUI backend that a headless tile solve never opens.  It
  # still provides the `matplotlib` dist-info that pip resolves against.
  - matplotlib-base
  - gdal
  - ipykernel
  - cython
  - tmux
  - netcdf4
  # Runtime imports that neither pyproject.toml nor LSsurf's requirements.txt
  # declares, found by walking the import graph from ATL1415/__init__.py:
  #   pytmd      -- 'import pyTMD' at ATL11_to_ATL15.py:45, top level
  #   timescale  -- 'import timescale' at ATL1415_attrs_meta.py:15, top level
  # Both are reached by `import ATL1415`, so they break the solve immediately.
  - pytmd
  - timescale
  # xarray is imported lazily inside read_bedmachine_greenland, so it does not
  # break the import -- it breaks the Greenland bedmachine mask path at runtime.
  - xarray
  # zarr is imported lazily inside ATL1415.tides.open_tide_dataset, so it too
  # survives `import ATL1415` -- but MAAP_dps.txt sets --tide_directory=s3://pytmd,
  # and that path reads the published <model>.zarr stores, so every DPS tile job
  # with a tide model needs it.
  - zarr
  - pip:
    # maap-py brokers the DAAC's temporary S3 credentials:
    #   maap.aws.earthdata_s3_credentials('https://data.nsidc.earthdatacloud.nasa.gov/s3credentials')
    # returns accessKeyId/secretAccessKey/sessionToken using MAAP's OWN auth, so
    # the NSIDC-protected ATL11 reads need no Earthdata credentials of ours on
    # the worker -- no .netrc, nothing at rest in the bucket.  See
    # docs.maap-project.org science/NISAR/NISAR_access.html cell [2], and
    # docs/howto_MAAP_staging.sh S7 q2.  Verified from the ADE 2026-09-08: that
    # endpoint returns all three fields.
    #
    # 5.1.0 SINCE 2026-09-10, from 4.2.0.  On the WORKER the version does not
    # matter: the only maap-py code a tile job runs -- MAAP(), its auth header,
    # aws.earthdata_s3_credentials(), the HTTP helper -- is code-identical in
    # 4.2.0, 5.1.0a2 and 5.1.0 (compared with docstrings stripped; the one
    # difference is three extra endpoint lookups for the OGC API), with the same
    # Requires-Dist.  It matters in the ADE, where this file also builds the
    # ATL14 env: 5.x dropped submitJob/getJob/getJobResult for the OGC calls
    # (submit_job, get_job_status, get_job_result), and the job scripts under
    # scripts/maap/ are being ported to those (docs/howto_MAAP_ogc.sh O5, O7).
    # What 5.x costs: ATL14 no longer carries the legacy calls, so the legacy
    # fallback (howto_MAAP_ogc F2) needs a throwaway env with maap-py==4.2.0.
    - maap-py==5.1.0
